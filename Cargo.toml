[package]
name = "suit"
version = "0.7.0"
edition = "2021"
description = "SUIT for Fedora: Setup Utilities by IteraThor for Autodarts (Rust port)"
license-file = "LICENSE"

[[bin]]
name = "suit"
path = "src/main.rs"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_18"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_7"] }
vte = { package = "vte4", version = "0.10" }
opencv = { version = "0.102", default-features = false, features = ["imgproc", "videoio", "imgcodecs", "calib3d", "features2d", "objdetect"] }
evdev = "0.13"
qrcode = { version = "0.14", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
log = { version = "0.4", features = ["std"] }
chrono = "0.4"
anyhow = "1"
glob = "0.3"
libc = "0.2"
ureq = { version = "3", features = ["json"] }
toml = "0.9"
which = "8"
once_cell = "1"
rand = "0.9"

[profile.release]
opt-level = 3
lto = "thin"
